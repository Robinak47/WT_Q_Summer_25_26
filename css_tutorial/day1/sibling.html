<!DOCTYPE html>
<html>

<head>
    <style>
        /* Adjacent Sibling */
        h1+p {
            color: mediumorchid;
        }

        /* general Sibling */
        h1~span {
            color: mediumpurple;
        }


        /* attribute selector */
        input[type="text"] {
            border: 3px solid mediumorchid;
        }

        /* Pseudo-class Selectors*/
        #pass:hover {
            border: 10px solid mediumaquamarine;
        }

        /* Pseudo-element Selectors*/
        #pass:hover {
            border: 10px solid mediumaquamarine;
        }

        #bPara::first-letter {
            color: magenta;
            font-weight: bold;
            font-size: x-large;
        }

        .a1 {
            color: mediumslateblue;
        }

        .a2 {
            border: 4px solid chartreuse;
        }

        .a3 {
            display: inline-block;
            height: 300px;
            width: 400px;
        }
    </style>

</head>

<body>

    <h1>
        i am h1
    </h1>
    <p>
        i am p
    </p>
    <button>
        i am a button
    </button>
    <p>
        i am another p
    </p>
    <span>
        i am span. general Sibling of h1
    </span>

    <input type="text">
    <input id="pass" type="password">
    <p id="bPara">
        bangladesh is a very beautiful country
    </p>

    <div class="a1 a2 a3">
        multiclass design tesgt
    </div>
</body>

</html>
