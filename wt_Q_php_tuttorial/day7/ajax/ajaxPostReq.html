<!doctype html>
<html>

<head>

</head>

<body>
    <form id="myform" action="dataControl.php">
        <input type="text" name="data" id="data">
        <input type="submit" value="submit" name="submit">
    </form>

    <div id="myDiv">
    </div>

    <script>
        const myForm = document.getElementById("myform");
        myForm.addEventListener("submit", (e) => {



            callAjax(e);
        });

        function callAjax(e) {
            e.preventDefault();
            console.log("ajax called");

            const xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                console.log(this.status);
                if (this.readyState == 4 && this.status == 200) {

                    const jsonObj = this.responseText;
                    const jsObj = JSON.parse(jsonObj);
                    const myDiv = document.getElementById("myDiv");
                    myDiv.innerHTML = "<h1>" + jsObj.name + "</h1>" + "<p>" + jsObj.age + "</p>";

                }


            }

            xhr.open("POST", "dataControl.php", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            var data = "data=" + encodeURIComponent(document.getElementById("data").value);

            xhr.send(data);

        }
    </script>
</body>

</html>
